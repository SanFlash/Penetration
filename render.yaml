services:
  - type: web
    name: sentinel-pentest
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: sentinel-evidence
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: SENTINEL_DATA_DIR
        value: /var/data
      - key: SENTINEL_DEFAULT_TARGET
        value: https://amwebtech.com
      - key: SENTINEL_ACCESS_TOKEN
        sync: false
