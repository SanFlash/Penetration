name: Sentinel Framework Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feat/security-phase-3"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application and test modules
        run: |
          python -m compileall -q main.py security.py scanners reports utils tests

      - name: Test
        run: python -m pytest tests/ -v
